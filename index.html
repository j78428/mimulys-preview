<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mimulys</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<style>
/* Layout: colour fields sampled from the commissioned night-water illustration, stacked as whole bands. */
:root{
  --night:#15296b; --night-deep:#0f1f55; --mist:#eef0f8; --paper:#fbfbfe; --ink:#1d2350; --ink-soft:#4d5380;
  --peri:#6470b4; --line:#d3d6e8; --rose:#f6dfe2; --sky:#d7e6f2; --sun:#d65f35; --sun-ink:#ad4420; --error:#b3261e; --error-bg:#fbeae8;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --gutter:clamp(16px,4vw,56px); --band:clamp(56px,8vw,112px);
  --ease:cubic-bezier(.23,1,.32,1); --drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.8 var(--sans);letter-spacing:.01em;font-variant-numeric:tabular-nums}
::selection{background:var(--rose);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#b9bedb;border:2px solid var(--mist)}::-webkit-scrollbar-track{background:var(--mist)}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-underline-offset:.25em;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.45;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(28px,3.4vw,42px)} h2{font-size:clamp(23px,2.5vw,31px)} h3{font-size:19px}
p{margin:0}
:focus-visible{outline:2px solid var(--peri);outline-offset:3px}
.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.inner{max-width:1280px;margin:0 auto}
.band{padding-block:var(--band)}
.measure{max-width:34em}
.soft{color:var(--ink-soft)}
.small{font-size:14px;line-height:1.7}
.sample{font-size:12px;line-height:1.5;color:var(--ink-soft);border:1px solid var(--line);padding:1px 8px;white-space:nowrap;display:inline-block}
.link{text-decoration:underline}
.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 28px;letter-spacing:.06em;background:var(--night);color:#fff;border:1px solid var(--night);text-decoration:none;font-weight:500;transition:background-color 180ms ease,color 180ms ease,transform 140ms var(--ease);text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.on-night{background:#fff;color:var(--night);border-color:#fff}
.btn.ghost-night{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn.full{width:100%}
.btn[disabled],.btn.is-off{background:#c7cae0;border-color:#c7cae0;color:#fff;cursor:not-allowed;transform:none}
@media (hover:hover) and (pointer:fine){
  .btn:not([disabled]):not(.ghost):not(.on-night):not(.ghost-night):hover{background:var(--night-deep)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .btn.on-night:hover{background:var(--sky)}
  .btn.ghost-night:hover{background:#fff;color:var(--night)}
  .card:hover .alt{opacity:1}
  .brandrow:hover .brandrow-name{color:var(--peri)}
  .navlink:hover{text-decoration:underline}
}
/* Header */
.proto{background:var(--night-deep);color:#e7eaf8;font-size:13px;line-height:1.5;text-align:center;padding-block:7px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.head-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:start}
.logo img:first-child{width:40px;height:auto}.logo img:last-child{width:112px;height:auto}
.nav{display:flex;gap:28px;align-items:center}
.nav-dd{position:relative;display:flex;align-items:center;gap:2px}
.nav-dd .icon{width:15px;height:15px}
.nav-menu{position:absolute;top:100%;left:-16px;min-width:168px;padding-top:24px;opacity:0;visibility:hidden;transition:opacity 140ms ease,visibility 0s linear 140ms}
.nav-menu>div{display:grid;gap:8px;background:var(--paper);border:1px solid var(--line);padding:14px 16px;font-size:14.5px}
.nav-menu a{text-decoration:none}
.nav-dd:hover .nav-menu,.nav-dd:focus-within .nav-menu{opacity:1;visibility:visible;transition-delay:0s}
.text-link{display:inline-block;font-weight:500;letter-spacing:.08em;text-decoration:underline;text-underline-offset:.5em}
.navlink{text-decoration:none;font-size:15px;white-space:nowrap}
.navlink[aria-current=page]{text-decoration:underline}
.tools{display:flex;align-items:center;gap:16px;justify-self:end}
.tool{position:relative;display:grid;place-items:center;width:40px;height:40px;transition:background-color 160ms ease}
.tool:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){.tool:hover{background:var(--mist)}}
.count{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;background:var(--sun-ink);color:#fff;font-size:11px;line-height:18px;text-align:center}
.menu-btn{display:none}
@media (max-width:767px){.nav{display:none}.menu-btn{display:grid;justify-self:start;margin-left:-8px}.head-in{gap:0;height:64px}.logo{justify-self:center}.logo img:first-child{display:none}.logo img:last-child{width:104px}.tools{gap:0;margin-right:-8px}.tool-member{display:none}}
/* Hero */
.hero{background:var(--night);color:#fff}
.hero-in{position:relative}
.hero-art{position:relative;overflow:hidden;background:var(--night-deep)}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--night) 0,rgba(21,41,107,.8) 30%,rgba(21,41,107,0) 58%)}
.hero-art img{width:100%;height:clamp(480px,46vw,680px);object-fit:cover;object-position:center 26%}
.hero-text{position:absolute;left:0;right:0;bottom:0;z-index:1;display:grid;gap:14px;justify-items:center;text-align:center;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) clamp(28px,4vw,52px) max(var(--gutter),env(safe-area-inset-left,0px))}
.hero-text h1{font-size:clamp(30px,3.6vw,50px);line-height:1.45}
.hero-text p{color:#e3e6f7;max-width:32em}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.hero-links{display:flex;flex-wrap:wrap;justify-content:center;gap:32px;margin-top:6px}
@media (max-width:767px){.hero-art img{height:min(135vw,600px)}.hero-text h1{font-size:30px}}
/* Product grid */
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(32px,3.4vw,48px) clamp(14px,2vw,28px)}
@media (max-width:960px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{text-decoration:none;display:grid;gap:12px;align-content:start;min-width:0}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--sky)}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-img .alt{opacity:0;transition:opacity 280ms ease}
.card-brand{font-size:13px;color:var(--ink-soft);line-height:1.5}
.card-name{font-family:var(--serif);font-size:16px;line-height:1.55}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.tag{font-size:12px;line-height:1.5;padding:0 7px;border:1px solid var(--ink);color:var(--ink)}
.tag.off{border-color:var(--ink-soft);color:var(--ink-soft)}
.card-text{display:grid;gap:3px;justify-items:start;text-align:left}
.is-sold .card-img img{opacity:.55}
/* Category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.8vw,24px)}
.tile{position:relative;display:block;overflow:hidden;text-decoration:none;color:#fff;min-height:clamp(300px,36vw,500px)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 900ms var(--ease)}
.tile-t{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:2px;background:rgba(15,31,85,.3)}
.tile-t h3{font-size:clamp(22px,2.6vw,34px)}
@media (hover:hover) and (pointer:fine){.tile:hover img{transform:scale(1.025)}}
@media (max-width:640px){.tile{min-height:220px}.tile-t .small{display:none}}
/* Editorial split */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,88px);align-items:center}
.split.rev{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.split-text{display:grid;gap:18px;justify-items:start}
.frame{border-bottom-right-radius:clamp(40px,6vw,96px);overflow:hidden;aspect-ratio:5/6;max-height:680px;width:100%}
.frame img{width:100%;height:100%;object-fit:cover;object-position:center 72%}
.rosefield{background:var(--rose)}.skyfield{background:var(--sky)}.nightfield{background:var(--night);color:#fff}
.nightfield .soft{color:#d0d5f0}
@media (max-width:767px){.split,.split.rev{grid-template-columns:1fr}.split>.frame{order:-1}}
/* Brand list */
.brandrow{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr) 92px;gap:24px;align-items:center;padding-block:22px;border-top:1px solid var(--line);text-decoration:none}
.brandrow:last-child{border-bottom:1px solid var(--line)}
.brandrow-name{font-family:var(--serif);font-size:clamp(21px,2.3vw,28px);line-height:1.4;transition:color 160ms ease}
.brandrow img{width:92px;height:92px;object-fit:cover;border-bottom-right-radius:28px}
@media (max-width:640px){.brandrow{grid-template-columns:minmax(0,1fr) 72px;gap:6px 14px}.brandrow img{width:72px;height:72px;grid-row:1/3;grid-column:2}}
/* Article list */
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.post{text-decoration:none;display:grid;gap:10px;align-content:start;padding-top:18px;border-top:1px solid currentColor}
.post h3{font-size:20px}
@media (max-width:760px){.posts{grid-template-columns:1fr}}
/* Footer */
.foot{background:var(--night-deep);color:#e7eaf8;padding-block:64px 36px}
.foot-grid{display:grid;grid-template-columns:minmax(0,4fr) repeat(3,minmax(0,2fr));gap:32px}
.foot h3{font:500 15px/1.6 var(--sans);margin-bottom:10px;letter-spacing:.04em}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline}
.foot-mark{width:56px;height:49px;background:#fff;-webkit-mask:url(img/mark.png) center/contain no-repeat;mask:url(img/mark.png) center/contain no-repeat;margin-bottom:12px}
.foot-note{margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px;line-height:1.8;color:#c9cfed}
@media (max-width:767px){.foot-grid{grid-template-columns:1fr;gap:28px;justify-items:center;text-align:center}.foot-mark{margin-inline:auto}.foot-note{text-align:center}}
/* Page chrome */
.page-head{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:clamp(36px,5vw,64px) clamp(20px,3vw,32px)}
.crumb{font-size:13.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;line-height:1.6}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.shop-list{padding-bottom:var(--band)}
@media (min-width:961px){.shop-list .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.shopbar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;margin-bottom:28px;border-block:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:28px}
.pill{display:inline-flex;align-items:center;min-height:38px;text-decoration:none;font-size:15px;border-bottom:2px solid transparent;transition:border-color 160ms ease}
.pill[aria-current=page]{border-bottom-color:var(--night);font-weight:500}
.empty{padding:64px 0;text-align:center;display:grid;gap:14px;justify-items:center}
/* Product page */
.pdp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4.5vw,72px);align-items:start;padding-block:32px var(--band)}
.pdp-main{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--sky)}
.pdp-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumb{width:76px;height:76px;overflow:hidden;border:1px solid transparent;padding:2px;transition:border-color 160ms ease}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-pressed=true]{border-color:var(--ink)}
.buy{display:grid;gap:18px;position:sticky;top:96px;min-width:0}
.buy-brand{text-decoration:underline;font-size:14.5px;color:var(--ink-soft);justify-self:start}
.price{font-size:23px;line-height:1.4}
.opts{display:grid;gap:6px}
.lab{font-size:14px;color:var(--ink-soft)}
.select,.input{width:100%;min-height:48px;background:#fff;border:1px solid #b5b9d4;padding:10px 14px;transition:border-color 160ms ease,box-shadow 160ms ease;font-size:16px}
.input:focus,.select:focus{outline:none;border-color:var(--night);box-shadow:0 0 0 1px var(--night)}
.input[aria-invalid=true]{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
.stepper{display:inline-flex;align-items:center;border:1px solid #b5b9d4;background:#fff}
.stepper button{width:44px;height:46px;display:grid;place-items:center}
.stepper output,.stepper span{min-width:30px;text-align:center}
.ship-note{border:1px solid var(--line);padding:14px 16px;font-size:14.5px;line-height:1.75;display:grid;gap:2px}
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;text-align:left;font-weight:500}
.acc .chev{transition:transform 200ms var(--ease)}
.acc[data-open=true] .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease)}
.acc[data-open=true] .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;font-size:15px;line-height:1.85;color:var(--ink-soft)}
.acc-b>div>div{padding-bottom:16px}
.acc[data-open=false] .acc-b>div{visibility:hidden}
.crumb-top{display:none}
@media (max-width:767px){.pdp{grid-template-columns:1fr;padding-top:16px}.buy{position:static}.thumb{width:64px;height:64px}.thumbs{justify-content:center}}
/* Brand block on the product page */
.pdp-brand{background:var(--rose)}
.pdp-brand .frame{max-height:440px;aspect-ratio:4/3}
/* Drawers */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,31,85,.42);opacity:0;pointer-events:none;transition:opacity 220ms ease}
.scrim.on{opacity:1;pointer-events:auto;transition-duration:320ms}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:41;width:min(460px,100%);background:var(--paper);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform 240ms var(--drawer),visibility 0s linear 240ms;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.left{right:auto;left:0;transform:translateX(-100%);border-left:0;border-right:1px solid var(--line)}
#navDrawer{width:min(300px,86vw);overflow:auto;display:block}
.drawer.on{transform:none;visibility:visible;transition:transform 340ms var(--drawer),visibility 0s}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:12px}
.dr-head h2{font-size:22px}
.dr-body{flex:1;overflow:auto;padding:4px 24px 24px;min-height:0}
.dr-foot{padding:16px 24px 22px;border-top:1px solid var(--line);display:grid;gap:12px}
.line{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:6px 14px;padding-block:16px;border-bottom:1px solid var(--line)}
.line img{width:84px;height:84px;object-fit:cover;grid-row:1/3}
.line-name{font-size:15px;line-height:1.55}
.line-opt{font-size:13.5px;color:var(--ink-soft)}
.line-ctl{grid-column:2/4;display:flex;justify-content:flex-end;align-items:center;gap:12px}
.line .stepper button{width:34px;height:34px}
.rm{color:var(--ink-soft);display:grid;place-items:center;width:34px;height:34px}
.rm .icon{width:19px;height:19px}
.rowsum{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.rowsum.total{font-size:19px;font-weight:500;padding-top:10px;border-top:1px solid var(--line)}
.free{font-size:13.5px;display:grid;gap:6px;padding:12px 0 4px}
.bar{height:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transform-origin:left;transition:transform 280ms var(--ease)}
.dr-back,.dr-count{display:none}
.dr-links{display:flex;justify-content:space-between;gap:12px}
.nav-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.mobile-nav{display:grid;padding:60px 24px 32px;gap:2px}
.mobile-nav a{text-decoration:none;padding:9px 0}
.mobile-nav a[aria-current=page]{text-decoration:underline;text-underline-offset:.4em}
.mobile-nav .sub{display:grid;padding-left:16px;font-size:15px;color:var(--ink-soft)}
.mobile-nav .sub a{padding:6px 0}
.mobile-nav .nav-contact{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-soft)}
.check{display:flex;align-items:center;gap:10px;min-height:32px;cursor:pointer}
.check input,.radio input{-webkit-appearance:none;appearance:none;width:18px;height:18px;flex:none;margin:0;background:#fff;border:1px solid var(--ink);cursor:pointer}
.check input:checked,.radio input:checked{background:var(--night);box-shadow:inset 0 0 0 3px #fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:9px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 220ms var(--ease);z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* Cart page and checkout */
.cart-grid,.co-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,5vw,72px);align-items:start}
.summary{border:1px solid var(--line);padding:24px;display:grid;gap:12px;position:sticky;top:96px;min-width:0}
.co-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.co-bar-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:8px}
.co-bar h1{font-size:21px}
.co-back{display:inline-flex;align-items:center;gap:4px;font-size:14.5px;text-decoration:none;justify-self:start}
.co-cart{justify-self:end;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.demo-chip{justify-self:center;font-size:12px;background:var(--rose);padding:1px 12px;line-height:1.7;display:block;width:max-content;margin:0 auto}
.co-sec{padding-block:26px;border-bottom:1px solid var(--line);display:grid;gap:16px}
.co-sec:first-child{padding-top:30px}
.co-sec.locked h2{color:var(--ink-soft)}
.co-sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.co-sec-h h2{font-size:22px}
.done-box{border:1px solid var(--line);padding:12px 16px;font-size:15px;line-height:1.7}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:14px}
.req{color:var(--error)}
.err{font-size:13.5px;color:var(--error);line-height:1.5}
.radio{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid #b5b9d4;padding:13px 15px;cursor:pointer;background:#fff;transition:border-color 160ms ease,box-shadow 160ms ease}
.radio input{margin-top:5px}
.radio:has(input:checked){border-color:var(--night);box-shadow:0 0 0 1px var(--night)}
.radio b{font-weight:500}
.radios{display:grid;gap:10px}
.rate-r{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.alert{border:1px solid var(--line);padding:12px 16px;font-size:14.5px;line-height:1.7}
.sum-toggle{display:none}
.sum-line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;font-size:14.5px;line-height:1.5;align-items:start}
.sum-line img{width:56px;height:56px;object-fit:cover}
.lock{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.lock .icon{width:15px;height:15px}
.steps{display:flex;gap:14px;font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.gateway{max-width:520px;margin:clamp(32px,7vw,88px) auto;border:1px solid var(--line);padding:32px;display:grid;gap:18px}
@media (max-width:767px){
  .cart-grid,.co-grid{grid-template-columns:1fr;gap:0}
  .summary{position:static}
  .co-grid .summary{order:-1;margin-inline:calc(-1 * var(--gutter));border-width:0 0 1px;padding:10px var(--gutter)}
  .cart-grid .summary{margin-top:24px}
  .frame{aspect-ratio:4/3;max-height:none}
  #cartDrawer .dr-head{display:grid;grid-template-columns:1fr auto 1fr;padding:12px 16px;border-bottom:1px solid var(--line)}
  #cartDrawer .dr-x,.dr-links{display:none}
  .dr-back{display:inline-flex;align-items:center;gap:4px;font-size:14.5px;justify-self:start}
  .dr-count{display:inline-flex;align-items:center;gap:4px;font-size:14px;justify-self:end}
  #cartDrawer .dr-head h2{font-size:21px}
  .sum-toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:36px;font-weight:500}
  .summary:not([data-open=true]) .sum-detail{display:none}
  .summary[data-open=true] .sum-toggle .chev{transform:rotate(180deg)}
  .sum-detail{display:grid;gap:12px;padding-top:6px}
}
@media (min-width:768px){.sum-detail{display:grid;gap:12px}}
@media (max-width:480px){.fields{grid-template-columns:1fr}.field{grid-column:1/-1}}
/* Read pages */
.prose{display:grid;gap:18px;max-width:36em}
.prose h2{margin-top:18px}
.search-in{display:flex;gap:10px;max-width:640px}
.guide-sec{scroll-margin-top:96px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.btn:active,.tool:active{transform:none}}
.card-img{aspect-ratio:1/1}
</style>
<link rel="stylesheet" href="mm-chrome.css?v=2">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<script src="mm-chrome.js?v=2"></script>
<script>
(function(){
const M=window.MM,SHOPU=M.SHOP,CATU={all:SHOPU+M.CAT.all,crystal:SHOPU+M.CAT.crystal,jewelry:SHOPU+M.CAT.jewelry};
const BRANDS={
  mimulys:{name:'Mimulys',line:'Jenn 自行設計，或以獨家款式呈現的水晶與飾品。',img:'img/9429433.jpg',
    story:['Mimulys 以水晶與飾品先行，與珠寶設計師合作，籌備由 Jenn 自行設計，或以獨家款式呈現的產品。','我們重視材質品質、造型，以及實際佩戴時的美感。透過攝影、文字與視覺設計，介紹作品的材質、特色與創作背景。'],
    craft:'捕捉光線、空間、人物與物件姿態的感受力，延續在 Jenn 的攝影作品與選物眼光之中。',craftImg:'img/7371946.jpg',sample:false},
  riverbank:{name:'河岸金工',line:'以銀與黃銅為材，做日常能一直戴著的飾品。',img:'img/9430468.jpg',
    story:['這是一段示意文字，正式上線時會換成合作品牌的真實介紹。這裡適合放品牌怎麼開始、由誰創作、作品想傳達的事。','Mimulys 會在這裡說明為什麼選擇這個品牌，以及作品與品牌美感呼應的地方。'],
    craft:'這段放材質與製作方式，例如金屬來源、手工步驟與表面處理。',craftImg:'img/12581241.jpg',sample:true},
  stillstone:{name:'靜石工作室',line:'挑選原礦與晶體，保留石頭原本的樣子。',img:'img/4040608.jpg',
    story:['這是一段示意文字，正式上線時會換成合作品牌的真實介紹。這裡適合放工作室的背景、選石標準與創作者的想法。','Mimulys 會在這裡說明為什麼選擇這個品牌，以及作品與品牌美感呼應的地方。'],
    craft:'這段放原礦來源、挑選方式與保存建議。',craftImg:'img/6474322.jpg',sample:true}
};
const P=[
 {id:'earring',name:'綠石金箔耳環',brand:'mimulys',cat:'jewelry',price:1880,isNew:1},
 {id:'silver',name:'銀色波紋項鍊',brand:'riverbank',cat:'jewelry',price:2480,isNew:1},
 {id:'tricolor',name:'三色石金箔項鍊',brand:'mimulys',cat:'jewelry',price:2280,isNew:1},
 {id:'frame',name:'方框藍石項鍊',brand:'riverbank',cat:'jewelry',price:1980,isNew:1},
 {id:'rutile',name:'鈦晶手珠',brand:'mimulys',cat:'crystal',price:4280},
 {id:'rose-trio',name:'粉晶原石三件組',brand:'mimulys',cat:'crystal',price:1980},
 {id:'clear-quartz',name:'白水晶原石',brand:'stillstone',cat:'crystal',price:1680},
 {id:'rose-obelisk',name:'粉晶方柱',brand:'stillstone',cat:'crystal',price:1280}
];
const POSTS=[
 {id:'origin',title:'選物的起點：東京 CA JITSU',sum:'2026 年 3 月，一只白瓷杯與一件 YAECA 上衣，讓 Jenn 開始思考如何選擇物件。',img:'img/4040608.jpg',
  body:['2026 年 3 月，我在東京造訪 CA JITSU，購買了一只韓國工藝家製作的白瓷杯，以及一件 YAECA 上衣。那次長時間停留店內的感受，至今仍鮮明地留在心裡。','物件雖然安靜，卻透過整個空間產生深刻的感染力。一件件物品的質地，以及它們被放在一起時所形成的雅緻，讓我開始更具體地思考：如何選擇物件，也如何讓它們的美被感受到。','這段經驗成為我思考品牌的重要指引：細心選擇，尊重創作者與物件的背景，透過適切的呈現，將它們交到下一位珍惜它們的人手中。'],to:['about','關於 Mimulys']},
 {id:'wind',title:'《迷航》：旅途中的光線與人物',sum:'九件拍攝於東京與檳城的作品，從演員的視角捕捉偶然的相遇。',img:'img/exhibition.jpg',
  body:['攝影個展《迷航》As the Wind Blows，2026 年 5 月 30 日至 8 月 30 日於 Ming Coffee 展出。','展覽展出九件拍攝於東京與檳城的作品。從演員的視角，捕捉旅途中偶然的相遇、光線、物件與人物的姿態。','身為演員所培養的感受力，也延續在 Jenn 的攝影作品與選物眼光之中。'],to:['brand-mimulys','Mimulys 自有系列']},
 {id:'name',title:'為什麼是猩紅猴面花',sum:'品牌名稱裡的生命力，來自一種在火災過後仍能生長的植物。',img:'img/illustration.jpg',
  body:['Mimulys 的名稱結合了 Mimulus cardinalis（猩紅猴面花）所啟發的生命力意象，以及 fleur-de-lys 百合紋章的優雅。','猩紅猴面花生長於北美的溪岸與濕潤地帶。在火災過後，隨著林冠打開、光線重新進入溪谷，新的植株也能在其中生長。','這份在環境變動之後仍能延續、重新綻放的生命力，成為 Mimulys 珍視的意象。'],to:['shop','逛選物']}
];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nt=n=>'NT$ '+Number(n).toLocaleString('en-US');
const ic=(n,c='')=>`<svg class="icon ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const card=p=>`<a class="card" href="${SHOPU}products/${encodeURIComponent(p.name)}">
  <span class="card-img"><img src="img/p-${p.id}.jpg" alt="${esc(p.name)}" loading="lazy"></span>
  <span class="card-text"><span class="card-brand">${esc(BRANDS[p.brand].name)}</span><span class="card-name">${esc(p.name)}</span>
  <span class="card-meta"><span>${nt(p.price)}</span></span></span></a>`;
const V={};
V.home=()=>`
<section class="hero"><div class="hero-in">
 <div class="hero-text"><h1>寧靜的美，<br>能夠給予內心力量。</h1>
  <p>Mimulys 從水晶與飾品出發，將美帶入日常。</p>
  <div class="hero-links"><a class="text-link" href="${CATU.all}">逛選物</a><a class="text-link" href="#brands">認識品牌</a></div>
 </div>
 <div class="hero-art"><img id="heroImg" src="img/illustration.jpg" width="1536" height="928" alt="鄭宜芳為 Mimulys 創作的世界觀插畫：夜空下一朵發光的花，花莖連到水面上的太陽。"></div>
</div></section>
<section class="wrap band" style="padding-top:clamp(36px,4vw,56px)"><div class="inner">
 <div class="sec-head"><h2>最新選物</h2><a class="link small" href="${CATU.all}">看全部商品</a></div>
 <div class="grid home-grid">${P.filter(p=>p.isNew).map(card).join('')}</div>
</div></section>
<section class="wrap" style="padding-bottom:var(--band)"><div class="inner tiles">
 <a class="tile" href="${CATU.crystal}"><img src="img/4040589.jpg" alt="淡紫色背景上的三件粉晶" loading="lazy"><span class="tile-t"><h3>水晶</h3><span class="small">原礦、滾石與細柱</span></span></a>
 <a class="tile" href="${CATU.jewelry}"><img src="img/p-tricolor.jpg" alt="三色石金箔項鍊" loading="lazy"><span class="tile-t"><h3>飾品</h3><span class="small">手珠、項鍊與耳環</span></span></a>
</div></section>
<section class="rosefield wrap band"><div class="inner split rev">
 <div class="frame"><img src="img/9429433.jpg" alt="深藍背景前，一位配戴珍珠的女性望著水杯" loading="lazy"></div>
 <div class="split-text"><h2>物件雖然安靜，<br>卻能感染整個空間。</h2>
  <p class="measure">Mimulys 由演員與攝影師 Jenn Chiang 創立。我們細心選擇，尊重創作者與物件的背景，透過適切的呈現，把它們交到下一位珍惜它們的人手中。</p>
  <a class="text-link" href="#about">關於 Mimulys</a></div>
</div></section>
<section class="wrap band"><div class="inner">
 <div class="sec-head"><h2>認識品牌</h2><a class="link small" href="#brands">看全部品牌</a></div>
 <div>${brandRows()}</div>
</div></section>
<section class="nightfield wrap band"><div class="inner">
 <div class="sec-head"><h2>札記</h2><a class="link small" href="#journal">看全部文章</a></div>
 <div class="posts">${POSTS.map(postCard).join('')}</div>
</div></section>`;
function brandRows(){return Object.entries(BRANDS).map(([k,b])=>`<a class="brandrow" href="#brand-${k}"><span class="brandrow-name">${esc(b.name)}${b.sample?' <span class="sample" style="vertical-align:middle">示意品牌</span>':''}</span><span class="soft">${esc(b.line)}</span><img src="${b.img}" alt="" loading="lazy"></a>`).join('')}
function postCard(p){return `<a class="post" href="#post-${p.id}"><h3>${esc(p.title)}</h3><p class="small soft">${esc(p.sum)}</p></a>`}
function acc(t,b,open){return `<div class="acc" data-open="${!!open}"><button data-acc aria-expanded="${!!open}"><span>${t}</span>${ic('chev','chev')}</button><div class="acc-b"><div><div>${b}</div></div></div></div>`}
V.brands=()=>`<div class="wrap"><div class="inner"><div class="page-head"><h1>品牌</h1><p class="measure soft">Mimulys 自有系列，以及與品牌美感呼應、在台灣介紹與販售的作品。</p></div><div style="padding-bottom:var(--band)">${brandRows()}</div></div></div>`;
function brandPage(k){const b=BRANDS[k];const ps=P.filter(p=>p.brand===k);return `
<section class="${k==='mimulys'?'nightfield':'skyfield'} wrap"><div class="inner split rev" style="padding-block:clamp(32px,5vw,64px)">
 <div class="frame" style="aspect-ratio:4/3"><img src="${b.img}" alt=""></div>
 <div class="split-text"><nav class="crumb" aria-label="導覽路徑" style="color:inherit"><a href="#brands">品牌</a><span>/</span><span>${esc(b.name)}</span></nav>
 <h1>${esc(b.name)}</h1>${b.sample?'<span class="sample" style="background:#fff">示意品牌，內容待提供</span>':''}<p class="measure">${esc(b.line)}</p><a class="btn ${k==='mimulys'?'on-night':''}" href="#brand-${k}-items" data-jump="items">看這個品牌的商品</a></div>
</div></section>
<section class="wrap band"><div class="inner split"><div class="split-text"><h2>品牌故事</h2>${b.story.map(s=>`<p class="measure">${esc(s)}</p>`).join('')}</div>
 <div class="split-text"><div class="frame" style="aspect-ratio:3/2"><img src="${b.craftImg}" alt="" loading="lazy"></div><h3>材質與工藝</h3><p class="measure soft">${esc(b.craft)}</p></div></div></section>
<section class="wrap" id="items" style="padding-bottom:var(--band);scroll-margin-top:96px"><div class="inner">
 <div class="sec-head"><h2>${esc(b.name)} 的商品</h2><a class="link small" href="${CATU.all}">看全部選物</a></div>
 <div class="grid">${ps.map(card).join('')}</div>
 <p class="small" style="margin-top:44px"><a class="link" href="#brands">看其他品牌</a></p>
</div></section>`}
V.about=()=>`
<section class="nightfield"><img src="img/illustration.jpg" alt="鄭宜芳為 Mimulys 創作的世界觀插畫" style="width:100%;max-height:68vh;object-fit:cover"></section>
<section class="wrap band"><div class="inner split">
 <div class="split-text"><h1>關於 Mimulys</h1><p class="measure" style="font-family:var(--serif);font-size:20px;line-height:1.8">我們珍視物件本身寧靜的美，也相信美所蘊含的力量，能在日常之中靜靜感染人心。</p><p class="small soft">這件作品由 Mimulys 委託台灣插畫家鄭宜芳創作，呈現品牌的世界觀。</p></div>
 <div class="prose"><h2 style="margin-top:0">選物的起點</h2><p>2026 年 3 月，Jenn 在東京造訪 CA JITSU，購買了一只韓國工藝家製作的白瓷杯，以及一件 YAECA 上衣。物件雖然安靜，卻透過整個空間產生深刻的感染力。</p><p>回到台灣後，Jenn 成立公司，開始籌備 Mimulys，細心選擇，尊重創作者與物件的背景。</p></div>
</div></section>
<section class="rosefield wrap band"><div class="inner split rev">
 <div style="display:grid;justify-items:center;padding:clamp(24px,5vw,64px)"><img src="img/mark.png" alt="Mimulys 紋章" width="200" height="174"></div>
 <div class="split-text"><h2>名字的由來</h2><p class="measure">品牌名稱結合了 Mimulus cardinalis（猩紅猴面花）的生命力，以及 fleur-de-lys 百合紋章的優雅。</p><p class="measure">猩紅猴面花生長於北美的溪岸。火災過後，光線重新進入溪谷，新的植株也能在其中生長。這份生命力，成為 Mimulys 珍視的意象。</p></div>
</div></section>
<section class="wrap band"><div class="inner split">
 <div class="split-text"><h2>創辦人 Jenn Chiang</h2><p class="measure">以台灣為據點的演員與攝影師，參與劇場演出，也出演影集與電影，其中於 Netflix 上架的影集有十部以上。</p><p class="measure soft small">演出作品節選：《百萬人的推理》《接招吧！製作人》《人選之人—造浪者》</p><p class="measure">2026 年的攝影個展《迷航》As the Wind Blows，展出九件拍攝於東京與檳城的作品。展覽與創作活動曾獲聯合報・女子漾與 PopDaily 介紹。</p><a class="link small" href="#post-wind">閱讀《迷航》</a></div>
 <div class="frame"><img src="img/exhibition.jpg" alt="攝影個展《迷航》海報上的東京街景" loading="lazy"></div>
</div></section>
<section class="nightfield wrap band"><div class="inner split">
 <div class="split-text"><h2>接下來的展開</h2><p class="measure">從水晶與飾品出發，逐步擴展至陶藝、器物與香氛，將美帶入身上佩戴的飾品、手中觸碰的器物，以及空間裡流動的香氣。</p></div>
 <div class="hero-cta" style="justify-content:flex-start;align-self:center"><a class="btn on-night" href="${CATU.all}">逛選物</a><a class="btn ghost-night" href="#brands">認識品牌</a></div>
</div></section>`;
V.journal=()=>`<div class="wrap"><div class="inner"><div class="page-head"><h1>札記</h1></div><div class="posts" style="padding-bottom:var(--band)">${POSTS.map(p=>`<a class="post" style="border:0;padding:0" href="#post-${p.id}"><span class="frame" style="aspect-ratio:4/3;display:block"><img src="${p.img}" alt="" loading="lazy"></span><h3>${esc(p.title)}</h3><p class="small soft">${esc(p.sum)}</p></a>`).join('')}</div></div></div>`;
function postPage(p){return `<article class="wrap band"><div class="inner" style="display:grid;gap:28px;justify-items:center"><div class="prose" style="width:100%"><nav class="crumb"><a href="#journal">札記</a></nav><h1>${esc(p.title)}</h1></div>
 <div class="frame" style="width:100%;max-width:900px;aspect-ratio:16/9"><img src="${p.img}" alt=""></div>
 <div class="prose" style="width:100%">${p.body.map(s=>`<p>${esc(s)}</p>`).join('')}<a class="btn ghost" style="justify-self:start" href="${p.to[0]==='shop'?CATU.all:'#'+p.to[0]}">${p.to[1]}</a></div></div></article>`}
V.guide=()=>`<div class="wrap"><div class="inner"><div class="page-head"><h1>購物說明</h1><p class="soft measure">以下規則為示意內容，正式上線前會依 Mimulys 確認的物流與金流更新。</p></div>
 <div class="split" style="align-items:start;padding-bottom:var(--band)"><div>
  ${acc('配送與運費','宅配到府 NT$150，1–2 個工作天。超商取貨 NT$60，2–4 個工作天。訂單滿 NT$3,000 免運。',true)}
  ${acc('付款方式','信用卡、LINE Pay、銀行轉帳與貨到付款。實際可用方式待金流確認。')}
  ${acc('現貨與預購','商品頁會標示現貨或預購。現貨付款後 1–2 個工作天出貨；預購依商品頁標示的時間出貨。')}
  ${acc('退換貨','收到商品後依消費者保護法享有猶豫期。Jenn 設計款與獨家款的規則待確認。')}
  ${acc('保養','避免碰水、香水與長時間日曬，不佩戴時收在乾燥的布袋中。')}
  </div>
  <form class="guide-sec" id="contact" data-contact style="display:grid;gap:14px" novalidate><h2>聯絡我們</h2><p class="soft small">contact@tonitrusillustris.com</p>
   <div class="field"><label for="ctName">姓名</label><input class="input" id="ctName" autocomplete="name"></div>
   <div class="field"><label for="ctMail">Email</label><input class="input" id="ctMail" type="email" autocomplete="email"></div>
   <div class="field"><label for="ctMsg">想詢問的事</label><textarea class="input" id="ctMsg" rows="4"></textarea></div>
   <button class="btn" style="justify-self:start">送出訊息</button><p class="small soft" id="ctDone" role="status"></p></form>
 </div></div></div>`;
function route(){return (location.hash||'#home').slice(1)||'home'}
const app=$('#app');
function render(){
 const r=route();let html;
 if(r==='home')html=V.home();
 else if(r==='brands')html=V.brands();
 else if(/^brand-(\w+)(-items)?$/.test(r)&&BRANDS[r.match(/^brand-(\w+)/)[1]])html=brandPage(r.match(/^brand-(\w+)/)[1]);
 else if(r==='about')html=V.about();
 else if(r==='journal')html=V.journal();
 else if(r.startsWith('post-')&&POSTS.find(p=>p.id===r.slice(5)))html=postPage(POSTS.find(p=>p.id===r.slice(5)));
 else if(r==='guide'||r==='guide-contact')html=V.guide();
 else html=`<div class="wrap"><div class="inner empty" style="padding-block:var(--band)"><h1>找不到這一頁</h1><a class="btn" href="#home">回到首頁</a></div></div>`;
 app.innerHTML=`<main id="view" tabindex="-1">${html}</main>`;
 window.scrollTo(0,0);
 if(/-items$/.test(r)){const t=$('#items');if(t)t.scrollIntoView()}
 if(r==='guide-contact'){const t=$('#contact');if(t)t.scrollIntoView()}
 const names={brands:'品牌',about:'關於',journal:'札記',guide:'購物說明','guide-contact':'聯絡我們'};const br=r.startsWith('brand-')&&BRANDS[r.split('-')[1]];const po=r.startsWith('post-')&&POSTS.find(x=>x.id===r.slice(5));const tt=names[r]||(br&&(br.name==='Mimulys'?'自有系列':br.name))||(po&&po.title)||'';document.title=tt?tt+'｜Mimulys':'Mimulys';
 revealHero();
}
let heroPlayed=false;
function revealHero(){const h=$('#heroImg');if(!h||heroPlayed||!h.animate||matchMedia('(prefers-reduced-motion:reduce)').matches)return;heroPlayed=true;h.animate([{filter:'brightness(.72) saturate(.82)'},{filter:'brightness(1) saturate(1)'}],{duration:1400,easing:'cubic-bezier(.23,1,.32,1)'})}
window.addEventListener('hashchange',render);
document.addEventListener('click',ev=>{const t=ev.target.closest('button,a');if(!t)return;
 if(t.matches('[data-acc]')){const a=t.closest('.acc');const o=a.dataset.open==='true';a.dataset.open=!o;t.setAttribute('aria-expanded',!o);return}
 if(t.matches('[data-jump]')){ev.preventDefault();const s=$('#items');if(s)s.scrollIntoView({behavior:'smooth'});return}
});
document.addEventListener('submit',ev=>{const t=ev.target;if(t.closest('.mm-search'))return;ev.preventDefault();
 if(t.matches('[data-contact]'))$('#ctDone').textContent='這是原型，訊息不會寄出。正式網站會在這裡顯示送出成功。';});
render();
})();
</script>
</body></html>
